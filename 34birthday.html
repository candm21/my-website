<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 34th Birthday Bestie 🐼</title>
<link rel="stylesheet" href="https://cdn.fontsource.org/fonts/playfair-display.css">
<link rel="stylesheet" href="https://cdn.fontsource.org/fonts/cormorant-garamond.css">
<link rel="stylesheet" href="https://cdn.fontsource.org/fonts/nunito.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
height:100vh;overflow:hidden;
background:#F8F5F0;
font-family:'Nunito',sans-serif;
display:flex;justify-content:center;align-items:center;
}

/* Plain background with heart pattern */
.hearts-bg{
position:fixed;width:100%;height:100%;
pointer-events:none;overflow:hidden;z-index:0;
}

.heart-float{
position:absolute;
animation:floatUp linear infinite;
opacity:0.15;
font-size:20px;
}

@keyframes floatUp{
0%{transform:translateY(100vh) rotate(0deg);opacity:0}
10%{opacity:0.15}
90%{opacity:0.15}
100%{transform:translateY(-50px) rotate(360deg);opacity:0}
}

/* Main container */
.main{
position:relative;z-index:10;
width:100%;max-width:450px;
padding:20px;
}

/* Card slider */
.card-wrapper{
position:relative;
width:100%;
height:580px;
perspective:1000px;
}

.card{
position:absolute;
width:100%;
height:100%;
transition:transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s;
transform-style:preserve-3d;
cursor:pointer;
border-radius:32px;
}

.card.hidden{
opacity:0;
pointer-events:none;
transform:translateX(100px) scale(0.95);
}

.card.prev{
opacity:0;
pointer-events:none;
transform:translateX(-100px) scale(0.95);
}

.card.flipped{
transform:rotateY(180deg);
}

/* Card faces */
.card-face{
position:absolute;
width:100%;
height:100%;
backface-visibility:hidden;
border-radius:32px;
padding:40px 30px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:#FFFFFF;
box-shadow:0 20px 50px rgba(0,0,0,0.08);
border:1px solid rgba(232,122,144,0.1);
}

.back{
transform:rotateY(180deg);
background:linear-gradient(135deg, #FFF5F7, #FFFFFF);
}

/* Top decoration line */
.card-face::before{
content:'';
position:absolute;
top:0;left:0;right:0;
height:4px;
background:linear-gradient(90deg, #E87A90, #D4AF37, #E87A90);
border-radius:32px 32px 0 0;
}

/* Chapter badge */
.chapter-badge{
position:absolute;
top:18px;
left:20px;
font-size:0.7rem;
text-transform:uppercase;
letter-spacing:2px;
color:#E87A90;
font-weight:700;
background:rgba(247,214,221,0.4);
padding:4px 12px;
border-radius:20px;
}

/* Slide counter */
.slide-counter{
position:absolute;
top:18px;
right:20px;
font-size:0.8rem;
color:#3D2C2E;
opacity:0.4;
font-weight:600;
}

/* Panda SVG */
.panda-container{
margin-bottom:20px;
position:relative;
}

.panda-container svg{
width:100px;
height:100px;
filter:drop-shadow(0 4px 8px rgba(0,0,0,0.05));
}

/* Panda animations */
.panda-bounce{
animation:bounce 2s ease-in-out infinite;
}

@keyframes bounce{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-10px)}
}

.panda-pulse{
animation:pulse 2s ease-in-out infinite;
}

@keyframes pulse{
0%,100%{transform:scale(1)}
50%{transform:scale(1.05)}
}

.panda-wiggle{
animation:wiggle 2s ease-in-out infinite;
}

@keyframes wiggle{
0%,100%{transform:rotate(-3deg)}
50%{transform:rotate(3deg)}
}

/* Quote text - made larger and clearer */
.quote-text{
font-family:'Cormorant Garamond',serif;
font-size:1.7rem;
line-height:1.6;
text-align:center;
color:#3D2C2E;
font-weight:500;
max-width:380px;
margin-bottom:20px;
}

.quote-text em{
color:#E87A90;
font-style:italic;
}

/* Accent text */
.accent-text{
font-size:0.85rem;
color:#E87A90;
font-weight:700;
letter-spacing:1px;
display:flex;
align-items:center;
gap:6px;
}

/* Footer */
.card-footer{
position:absolute;
bottom:20px;
font-family:'Cormorant Garamond',serif;
font-style:italic;
color:#E87A90;
font-size:1rem;
}

/* Back side secret message */
.secret-msg{
font-family:'Cormorant Garamond',serif;
font-size:1.5rem;
line-height:1.6;
text-align:center;
color:#3D2C2E;
font-weight:600;
font-style:italic;
max-width:350px;
}

.secret-emoji{
font-size:2.5rem;
display:block;
margin-top:15px;
}

/* Flip hint */
.flip-hint{
position:absolute;
bottom:20px;
left:20px;
font-size:0.65rem;
color:#3D2C2E;
opacity:0.3;
display:flex;
align-items:center;
gap:4px;
}

/* Navigation */
.nav-controls{
margin-top:25px;
display:flex;
justify-content:center;
align-items:center;
gap:20px;
}

.nav-btn{
border:none;
padding:12px 24px;
border-radius:30px;
background:#FFFFFF;
cursor:pointer;
font-size:18px;
box-shadow:0 8px 20px rgba(0,0,0,0.08);
transition:all 0.3s ease;
color:#3D2C2E;
font-weight:700;
}

.nav-btn:hover{
transform:translateY(-3px);
box-shadow:0 12px 25px rgba(0,0,0,0.12);
}

.nav-btn:disabled{
opacity:0.3;
cursor:not-allowed;
transform:none;
}

/* Counter */
.counter-display{
margin-top:15px;
text-align:center;
font-size:0.8rem;
color:#3D2C2E;
opacity:0.4;
font-weight:600;
}

/* Progress dots */
.dots-nav{
margin-top:12px;
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:4px;
max-width:400px;
}

.dot-btn{
width:6px;
height:6px;
border-radius:50%;
background:#E87A90;
opacity:0.2;
border:none;
padding:0;
cursor:pointer;
transition:all 0.3s ease;
}

.dot-btn.active{
opacity:1;
transform:scale(1.3);
}

/* Cover card special styling */
.cover-card .quote-text{
font-size:1.5rem;
}

.cover-title{
font-family:'Playfair Display',serif;
font-size:2rem;
color:#3D2C2E;
text-align:center;
margin-top:15px;
line-height:1.3;
}

.cover-subtitle{
font-family:'Cormorant Garamond',serif;
font-size:1.1rem;
color:#E87A90;
font-style:italic;
margin-top:8px;
text-align:center;
}

.start-btn{
margin-top:25px;
padding:12px 30px;
border:none;
border-radius:30px;
background:linear-gradient(135deg, #E87A90, #D4AF37);
color:white;
font-weight:700;
cursor:pointer;
box-shadow:0 8px 20px rgba(232,122,144,0.3);
transition:all 0.3s ease;
}

.start-btn:hover{
transform:translateY(-2px);
box-shadow:0 12px 30px rgba(232,122,144,0.4);
}

/* Finale card */
.finale-card .quote-text{
font-size:1.4rem;
}

.finale-title{
font-family:'Playfair Display',serif;
font-size:1.8rem;
color:#3D2C2E;
text-align:center;
margin-top:15px;
}

/* Responsive */
@media(max-width:500px){
.card-wrapper{height:540px}
.card-face{padding:30px 20px}
.quote-text{font-size:1.4rem}
.cover-title{font-size:1.6rem}
.panda-container svg{width:80px;height:80px}
}
</style>
</head>

const pandaAnimations = ['panda-bounce', 'panda-pulse', 'panda-wiggle'];

function renderCards() {
const wrapper = document.getElementById('cardWrapper');
const dotsNav = document.getElementById('dotsNav');

// Cover card
let html = `
<div class="card" data-index="0" id="card-0">
<div class="card-face front">
<div class="panda-container"><div class="panda-bounce">${pandaSVGs.cover}</div></div>
<h2 class="cover-title">Happy 34th Birthday,<br>My Dearest Bestie</h2>
<p class="cover-subtitle">34 reasons the universe is better with you in it</p>
<button class="start-btn" onclick="nextCard()">Begin the Magic ✨</button>
<div class="card-footer" style="position:relative;bottom:auto;margin-top:20px">♥ Always & Always</div>
<div class="counter-display" style="position:relative;margin-top:10px;bottom:auto">1 / 34</div>
</div>
</div>`;

// Message cards
messages.forEach((msg, i) => {
const idx = i + 1;
const pandaType = msg.panda || 'happy';
const animClass = pandaAnimations[i % 3];
const svg = pandaSVGs[pandaType] || pandaSVGs.happy;
const isFinale = idx === 34;

html += `
<div class="card hidden" data-index="${idx}" id="card-${idx}">
<div class="card-face front ${isFinale ? 'finale-card' : ''}">
<span class="chapter-badge">${msg.chapter}</span>
<span class="slide-counter">${idx + 1} / 34</span>
<div class="panda-container"><div class="${animClass}">${svg}</div></div>
<blockquote class="quote-text">${msg.msg}</blockquote>
<div class="accent-text">${msg.accent}</div>
<span class="flip-hint">👆 Tap to flip</span>
<div class="card-footer">♥ Always & Always</div>
</div>
<div class="card-face back">
<span class="slide-counter">${idx + 1} / 34</span>
<div class="panda-container"><div class="panda-pulse">${svg}</div></div>
<div class="secret-msg">${msg.secret}<span class="secret-emoji">${msg.emoji}</span></div>
<div class="card-footer">♥ Always & Always</div>
</div>
</div>`;
});

wrapper.innerHTML = html;

// Dots
let dotsHTML = '';
for (let i = 0; i < 34; i++) {
dotsHTML += `<button class="dot-btn ${i === 0 ? 'active' : ''}" onclick="goToCard(${i})"></button>`;
}
dotsNav.innerHTML = dotsHTML;
}

let currentCard = 0;
let isAnimating = false;

function updateDisplay() {
const cards = document.querySelectorAll('.card');
cards.forEach((card, i) => {
card.classList.remove('hidden', 'prev');
if (i === currentCard) {
// Show current card
} else if (i < currentCard) {
card.classList.add('prev');
} else {
card.classList.add('hidden');
}
});

// Update dots
document.querySelectorAll('.dot-btn').forEach((dot, i) => {
dot.classList.toggle('active', i === currentCard);
});

// Update counter
document.getElementById('counterDisplay').textContent = `${currentCard + 1} / 34`;

// Update button states
document.getElementById('prevBtn').disabled = currentCard === 0;
document.getElementById('nextBtn').disabled = currentCard === 33;
}

function nextCard() {
if (isAnimating || currentCard >= 33) return;
isAnimating = true;
currentCard++;
updateDisplay();
setTimeout(() => isAnimating = false, 600);
}

function prevCard() {
if (isAnimating || currentCard <= 0) return;
isAnimating = true;
currentCard--;
updateDisplay();
setTimeout(() => isAnimating = false, 600);
}

function goToCard(index) {
if (isAnimating || index === currentCard) return;
isAnimating = true;
currentCard = index;
updateDisplay();
setTimeout(() => isAnimating = false, 600);
}

// Card flip
document.addEventListener('click', function(e) {
const cardFace = e.target.closest('.card-face');
if (cardFace) {
const card = cardFace.closest('.card');
card.classList.toggle('flipped');
}
});

// Floating hearts background
function createHearts() {
const container = document.getElementById('heartsBg');
const symbols = ['♥', '♡', '💕', '💖', '💗'];
setInterval(() => {
const heart = document.createElement('div');
heart.className = 'heart-float';
heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
heart.style.left = Math.random() * 100 + '%';
heart.style.animationDuration = (8 + Math.random() * 8) + 's';
heart.style.fontSize = (15 + Math.random() * 15) + 'px';
heart.style.color = ['#E87A90', '#D4AF37', '#F7D6DD'][Math.floor(Math.random() * 3)];
container.appendChild(heart);
setTimeout(() => heart.remove(), 16000);
}, 600);
}

// Keyboard navigation
document.addEventListener('keydown', e => {
if (e.key === 'ArrowRight' || e.key === ' ') nextCard();
if (e.key === 'ArrowLeft') prevCard();
});

// Touch support
let startX = 0;
document.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
const diff = startX - e.changedTouches[0].clientX;
if (Math.abs(diff) > 50) {
if (diff > 0) nextCard();
else prevCard();
}
}, { passive: true });

// Initialize
renderCards();
createHearts();
updateDisplay();
</script>
