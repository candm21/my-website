<!DOCTYPE html>

  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ============================================================
   1. NUMBER & FORMAT HELPERS
   ============================================================ */
function numberToWords(n) {
  const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine',
    'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen',
    'Seventeen', 'Eighteen', 'Nineteen'];
  const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  if (n < 20) return ones[n];
  if (n < 100) return tens[Math.floor(n / 10)] + (n % 10 ? '-' + ones[n % 10] : '');
  return ones[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' ' + numberToWords(n % 100) : '');
}

function indianGroup(intStr) {
  if (intStr.length <= 3) return intStr;
  const last3 = intStr.slice(-3);
  let rest = intStr.slice(0, -3);
  const groups = [];
  while (rest.length > 2) { groups.unshift(rest.slice(-2)); rest = rest.slice(0, -2); }
  if (rest) groups.unshift(rest);
  return groups.join(',') + ',' + last3;
}

function formatIndian(number, decimals = 2) {
  const neg = number < 0;
  const abs = Math.abs(number);
  const parts = abs.toFixed(decimals).split('.');
  return (neg ? '-' : '') + indianGroup(parts[0]) + (parts[1] ? '.' + parts[1] : '');
}

const fmt2 = n => formatIndian(n, 2);

function formatShort(n) {
  const abs = Math.abs(n), sign = n < 0 ? '-' : '';
  if (abs >= 1e7) return sign + '₹' + (abs / 1e7).toFixed(2) + ' Cr';
  if (abs >= 1e5) return sign + '₹' + (abs / 1e5).toFixed(2) + ' L';
  if (abs >= 1e3) return sign + '₹' + (abs / 1e3).toFixed(2) + ' K';
  return sign + '₹' + abs.toFixed(2);
}

function breakdown(number) {
  const numStr = Math.abs(number).toFixed(2);
  const [intPart, decPart] = numStr.split('.');
  const padded = intPart.padStart(7, '0');
  const ones = parseInt(padded.slice(-3), 10);
  const thousands = parseInt(padded.slice(-5, -3), 10);
  const lakhs = parseInt(padded.slice(-7, -5), 10);
  const crores = parseInt(padded.slice(0, -7), 10) || 0;
  const paise = parseInt(decPart, 10);
  const parts = [];
  if (crores) parts.push({ value: crores, unit: 'Crore', words: numberToWords(crores) });
  if (lakhs) parts.push({ value: lakhs, unit: 'Lakh', words: numberToWords(lakhs) });
  if (thousands) parts.push({ value: thousands, unit: 'Thousand', words: numberToWords(thousands) });
  if (ones) parts.push({ value: ones, unit: '', words: numberToWords(ones) });
  if (paise) parts.push({ value: paise, unit: 'Paise', words: numberToWords(paise) });
  return parts;
}

function fullWords(number) {
  const parts = breakdown(number);
  const rupeeParts = parts.filter(p => p.unit !== 'Paise');
  const paiseParts = parts.filter(p => p.unit === 'Paise');
  let str = rupeeParts.map(p => (p.unit ? p.words + ' ' + p.unit : p.words)).join(' ');
  if (paiseParts.length) {
    const pw = paiseParts[0].words + ' Paise';
    str = str ? str + ' and ' + pw : pw;
  }
  return (number < 0 ? 'Minus ' : '') + (str || 'Zero');
}

/* ============================================================
   2. CASH HELPERS (₹500 = highest note, NO ₹2000)
   ============================================================ */
const DENOMS = [
  { v: 500, label: '₹500', note: true },
  { v: 200, label: '₹200', note: true },
  { v: 100, label: '₹100', note: true },
  { v: 50,  label: '₹50',  note: true },
  { v: 20,  label: '₹20',  note: true },
  { v: 10,  label: '₹10',  note: true },
  { v: 5,   label: '₹5',   note: false },
  { v: 2,   label: '₹2',   note: false },
  { v: 1,   label: '₹1',   note: false },
];

function denominations(amount) {
  let rem = Math.floor(Math.abs(amount));
  const out = [];
  for (const d of DENOMS) {
    const c = Math.floor(rem / d.v);
    if (c > 0) { out.push({ ...d, count: c }); rem -= c * d.v; }
  }
  return out;
}

function cashString(amount) {
  const d = denominations(amount);
  if (!d.length) return 'Less than ₹1 — paise only';
  return d.map(x => (x.note ? '💵' : '🪙') + ' ' + x.count + ' × ' + x.label).join(' + ');
}

/* ============================================================
   3. ROBUST CLIPBOARD (works on file:// — 3-step fallback)
   ============================================================ */
function copyText(text, onDone) {
  const finish = () => { if (onDone) onDone(); };
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (ok) { finish(); return; }
    } catch (e) {}
    try { window.prompt('Press Ctrl+C to copy:', text); } catch (e) {}
    finish();
  };
  try {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(finish).catch(fallback);
    } else {
      fallback();
    }
  } catch (e) { fallback(); }
}

function evalExpr(expr) {
  let clean = expr.replace(/×/g, '*').replace(/÷/g, '/');
  if (!clean.trim()) return null;
  if (!/^[0-9+\-*/().%\s]+$/.test(clean)) return null;
  /* Strict-mode JS rejects leading-zero integers (e.g. "01") as legacy octals — strip
     redundant leading zeros from each number so keys like 0 → 1 keep working. */
  clean = clean.replace(/\d+\.?\d*/g, m => m.replace(/^0+(?=\d)/, ''));
  try {
    const val = Function('"use strict";return (' + clean + ')')();
    return (typeof val === 'number' && isFinite(val)) ? val : null;
  } catch (e) { return null; }
}

function calcEMI(P, annualRate, months) {
  if (P <= 0 || months <= 0) return 0;
  const r = annualRate / 1200;
  if (r === 0) return P / months;
  const f = Math.pow(1 + r, months);
  return P * r * f / (f - 1);
}

const AREA_UNITS = {
  ft: { label: 'Feet', toM: 0.3048 },
  m:  { label: 'Meters', toM: 1 },
  cm: { label: 'Centimeters', toM: 0.01 },
  in: { label: 'Inches', toM: 0.0254 },
  yd: { label: 'Yards', toM: 0.9144 },
};

const MASS_UNITS = [
  { k: 'mg', label: 'Milligram (mg)', f: 0.000001 },
  { k: 'g',  label: 'Gram (g)', f: 0.001 },
  { k: 'kg', label: 'Kilogram (kg)', f: 1 },
  { k: 'quintal', label: 'Quintal (100 kg)', f: 100 },
  { k: 't',  label: 'Tonne (1000 kg)', f: 1000 },
];

const CARD_WEIGHTS = [50, 100, 200, 250, 500, 750, 1000, 2000];

const MILK_DEFAULTS = [
  { id: 'fcm', name: 'FCM Milk', price: '34' },
  { id: 'orange', name: 'Orange Milk', price: '30' },
  { id: 'green', name: 'Green Milk', price: '22' },
  { id: 'blue', name: 'Blue Milk', price: '20' },
  { id: 'curd10', name: 'Curd (₹10)', price: '8.5' },
  { id: 'milk10', name: 'Milk (₹10)', price: '9' },
  { id: 'curdhalf', name: '½L Curd', price: '' },
  { id: 'tea', name: 'Tea Packet', price: '' },
  { id: 'extra', name: 'Extra', price: '' },
];

function useLocalStorage(key, initial) {
  const [val, setVal] = useState(() => {
    try {
      const s = localStorage.getItem(key);
      return s !== null ? JSON.parse(s) : initial;
    } catch (e) { return initial; }
  });
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }, [key, val]);
  return [val, setVal];
}

/* ============================================================
   4. SHARED UI
   ============================================================ */
function CopyCashBtn({ amount, label = '📋 Copy + 💵' }) {
  const [ok, setOk] = useState(false);
  const text =
    '₹ ' + fmt2(amount) +
    '\nWords: ' + fullWords(amount) +
    '\nPay: ' + cashString(amount);
  const copy = () => copyText(text, () => { setOk(true); setTimeout(() => setOk(false), 1500); });
  return <button className="copy-btn" onClick={copy}>{ok ? '✓ Copied!' : label}</button>;
}

/* Copy button that also lists the GST break-up (used by Provision Shop) */
function CopyCashWithGSTBtn({ itemCount, subtotal, gstRate, gstAmt, total, label = '📋 Copy + 💵' }) {
  const [ok, setOk] = useState(false);
  const lines = [];
  if (itemCount !== undefined) lines.push('Total item count (' + itemCount + ')');
  lines.push('Subtotal: ₹ ' + fmt2(subtotal));
  if (gstRate > 0) {
    lines.push('GST (' + gstRate + '%): ₹ ' + fmt2(gstAmt));
    lines.push('Total (incl. GST): ₹ ' + fmt2(total));
  } else {
    lines.push('Total: ₹ ' + fmt2(total));
  }
  lines.push('Words: ' + fullWords(total));
  lines.push('Pay: ' + cashString(total));
  const text = lines.join('\n');
  const copy = () => copyText(text, () => { setOk(true); setTimeout(() => setOk(false), 1500); });
  return <button className="copy-btn" onClick={copy}>{ok ? '✓ Copied!' : label}</button>;
}

/* Copy button that lists each item line above the total (used by Item Counter & Shop Bill) */
function CopyCashWithItemsBtn({ itemLines, total, label = '📋 Copy + 💵' }) {
  const [ok, setOk] = useState(false);
  const lines = [...itemLines, 'Total: ₹ ' + fmt2(total), 'Words: ' + fullWords(total), 'Pay: ' + cashString(total)];
  const text = lines.join('\n');
  const copy = () => copyText(text, () => { setOk(true); setTimeout(() => setOk(false), 1500); });

/* ============================================================

   ============================================================ */
function BreakdownTab({ seed, rain, pushHistory }) {
  const [input, setInput] = useState('');
  const [number, setNumber] = useState(null);
  const [error, setError] = useState('');

  useEffect(() => {
    if (seed) { setInput(String(seed.v)); setNumber(seed.v); setError(''); }
  }, [seed]);

  const submit = (val) => {
    const cleaned = String(val).replace(/,/g, '').trim();
    if (cleaned === '' || isNaN(parseFloat(cleaned))) {
      setError('Invalid input! Please enter a valid number.');
      setNumber(null);
      return;
    }
    setError('');
    const num = parseFloat(cleaned);
    setNumber(num);
    rain();
    pushHistory('💰', 'Amount', num);
  };

  return (
    <div>
      <div className="input-row">
        <input
          type="text"
          placeholder="e.g. 16426979.29"
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && submit(input)}
        />
        <button onClick={() => submit(input)}>Convert</button>
      </div>
      <div className="row-actions" style={{ justifyContent: 'center', marginTop: 0, marginBottom: 6 }}>
        <button className="ghost" onClick={() => { setInput(''); setNumber(null); setError(''); }}>🧹 Clear all</button>
      </div>

      {error && <p className="error">⚠️ {error}</p>}
      {number !== null && !error && <MoneyStats value={number} />}

      <div className="presets">
        {['1', '99.99', '125000', '16426979.29', '123456789', '1000000000'].map(v => (
          <button key={v} onClick={() => { setInput(v); submit(v); }}>{v}</button>
        ))}
      </div>
    </div>
  );
}

/* ============================================================
   6. TAB: CALCULATOR
   ============================================================ */
function CalculatorTab({ rain, pushHistory }) {
  const [expr, setExpr] = useState('');
  const [result, setResult] = useState(null);
  const [error, setError] = useState('');

  const preview = evalExpr(expr);

  const press = (k) => {
    setError('');
    if (k === 'C') { setExpr(''); setResult(null); return; }
    if (k === '⌫') { setExpr(e => e.slice(0, -1)); setResult(null); return; }
    setExpr(e => e + k);
    setResult(null);
  };

  const equals = () => {
    const v = evalExpr(expr);
    if (v === null) { setError('Invalid expression!'); setResult(null); return; }
    setError('');
    setResult(v);
    rain();
    pushHistory('🧮', expr, v);
  };

  const clearAll = () => { setExpr(''); setResult(null); setError(''); };

  /* Numpad keys are read via e.code so they work even when NumLock is off
     (the physical key is still recognised, and we insert the right symbol ourselves). */
  const NUMPAD_MAP = {
    Numpad0: '0', Numpad1: '1', Numpad2: '2', Numpad3: '3', Numpad4: '4',
    Numpad5: '5', Numpad6: '6', Numpad7: '7', Numpad8: '8', Numpad9: '9',
    NumpadDecimal: '.', NumpadAdd: '+', NumpadSubtract: '-',
    NumpadMultiply: '×', NumpadDivide: '÷',
  };
  const handleKeyDown = (e) => {
    if (e.key === 'Enter' || e.code === 'NumpadEnter') { e.preventDefault(); equals(); return; }
    if (NUMPAD_MAP[e.code]) {
      e.preventDefault();
      setExpr(x => x + NUMPAD_MAP[e.code]);
      setResult(null);
      setError('');
    }
  };

  const keys = ['7','8','9','÷','4','5','6','×','1','2','3','-','0','.','(',')','+','%','C','⌫'];
  const ops = ['÷','×','-','+','%'];

  return (
    <div>
      <div className="calc-display">
        <input
          value={expr}
          onChange={e => { setExpr(e.target.value); setResult(null); setError(''); }}
          onKeyDown={handleKeyDown}
          placeholder="0"
        />
        <div className="preview">{preview !== null ? '= ' + formatIndian(preview) : ''}</div>
      </div>

      <div className="row-actions" style={{ justifyContent: 'center', marginTop: 0, marginBottom: 6 }}>
        <button className="ghost" onClick={clearAll}>🧹 Clear all</button>
      </div>

      {error && <p className="error">⚠️ {error}</p>}

      <div className="keypad">
        {keys.map(k => (
          <button
            key={k}
            className={k === 'C' || k === '⌫' ? 'danger' : (ops.indexOf(k) >= 0 ? 'op' : '')}
            onClick={() => press(k)}
          >{k}</button>
        ))}
        <button className="eq" onClick={equals}>= &nbsp;See Rupee Breakdown</button>
      </div>

      {result !== null && !error && (
        <MoneyStats value={result} extraLines={['Expression: ' + expr + ' = ' + formatIndian(result)]} />
      )}
    </div>
  );
}

  const [raw, setRows] = useLocalStorage('provisionV1', null);
  const rows = Array.isArray(raw) && raw.length
    ? raw.map(r => ({ name: '', mode: 'count', price: '', qty: '', unit: 'g', ...r }))
    : [{ id: 1, name: '', mode: 'count', price: '', qty: '', unit: 'g' }];
  const [quick, setQuick] = useState('');
  const [lastAdded, setLastAdded] = useState(null);
  const [gstRate, setGstRate] = useLocalStorage('provisionGstV1', 0);
  const [gstCustom, setGstCustom] = useState('');

  const upd = (id, k, v) => setRows(rows.map(r => (r.id === id ? { ...r, [k]: v } : r)));

  const delRow = (id) => setRows(
    rows.length > 1
      ? rows.filter(r => r.id !== id)
      : [{ id: 1, name: '', mode: 'count', price: '', qty: '', unit: 'g' }]
  );

  const addRow = (mode, name = '', price = '', qty = '') => {
    const id = Date.now() + Math.random();
    setRows([...rows, { id, name, mode, price, qty, unit: 'g' }]);
    setLastAdded(id);
  };

  /* Type "Pepper" → Enter → pc (count) row, cursor on Rate */
  const quickAdd = () => {
    const name = quick.trim();
    if (!name) return;
    addRow('count', name);
    setQuick('');
  };

  /* Egg buttons: count row with rate × 6 ready (₹7.5 × 6 = ₹45) */
  const addEgg = (rate) => addRow('count', '🥚 Egg', rate, '6');

  /* Wipe every row back to one blank pc row, and reset GST to 0% */
  const clearAll = () => {
    setRows([{ id: Date.now(), name: '', mode: 'count', price: '', qty: '', unit: 'g' }]);
    setGstRate(0);
    setGstCustom('');
  };
  /* Keep items & rates, just zero out the quantities so totals recalc from scratch */
  const clearQty = () => setRows(rows.map(r => ({ ...r, qty: '' })));

  const toggleMode = (r) => {
    const newMode = r.mode === 'weight' ? 'count' : 'weight';
    upd(r.id, 'mode', newMode);
    if (newMode === 'count' && r.qty !== '') {
      upd(r.id, 'qty', String(Math.max(0, Math.floor(parseFloat(r.qty) || 0))));
    }
  };

  const calc = (r) => {
    const p = parseFloat(r.price), q = parseFloat(r.qty);
    if (isNaN(p) || isNaN(q) || q <= 0) return { ok: false, amt: 0, detail: '' };
    if (r.mode === 'count') {
      const n = Math.floor(q);
      return { ok: true, amt: p * n, detail: fmt2(p) + ' × ' + n + ' pc' };
    }
    const kg = (r.unit === 'kg') ? q : q / 1000;
    return { ok: true, amt: p * kg, detail: '₹' + fmt2(p / 10) + ' /100g' };
  };

  const subtotal = rows.reduce((s, r) => s + calc(r).amt, 0);
  const anyOk = rows.some(r => calc(r).ok);
  const wCount = rows.filter(r => r.mode === 'weight' && calc(r).ok).length;
  const cCount = rows.filter(r => r.mode === 'count' && calc(r).ok).length;

  const effGst = gstCustom !== '' && !isNaN(parseFloat(gstCustom)) ? parseFloat(gstCustom) : (parseFloat(gstRate) || 0);
  const gstAmt = subtotal * effGst / 100;
  const total = subtotal + gstAmt;

  const setQty = (r, q) => upd(r.id, 'qty', String(Math.max(0, q)));

  /* Typing a rate on a pc row with no qty yet assumes 1 pc, so it starts working right away */
  const updPrice = (r, v) => setRows(rows.map(x => (
    x.id === r.id
      ? { ...x, price: v, qty: (x.mode === 'count' && x.qty === '' && v !== '') ? '1' : x.qty }
      : x
  )));

  return (
    <div>
      {/* Quick add: type name → Enter or + (weight mode) */}
      <div className="input-row" style={{ marginBottom: 8 }}>
        <input
          type="text"
          placeholder='Item name → Enter adds 🥚 pc row (toggle to ⚖️ anytime)'
          value={quick}
          onChange={e => setQuick(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && quickAdd()}
        />
        <button onClick={quickAdd}>+ Add item</button>
      </div>

      {/* Count quick buttons — egg tray ready to go */}
      <div className="row-actions" style={{ marginTop: 0, marginBottom: 6 }}>
        <button className="ghost" onClick={() => addRow('weight')}>+ ⚖️ Weight row</button>
        <button className="ghost" onClick={() => addRow('count')}>+ 🥚 Count row</button>
        <button className="ghost" onClick={() => addEgg('7.5')}>🥚 ₹7.5 ×6 = ₹45</button>
        <button className="ghost" onClick={() => addEgg('6.5')}>🥚 ₹6.5 ×6</button>
        <button className="ghost" onClick={() => addEgg('6')}>🥚 ₹6 ×6</button>
      </div>
      <div className="row-actions" style={{ marginTop: 0, marginBottom: 6 }}>
        <button className="ghost" onClick={clearQty}>🧹 Clear quantities</button>
        <button className="ghost" onClick={clearAll}>↺ Clear all items</button>
      </div>

      <div className="tbl-wrap">
        <table>
          <thead>
            <tr><th>Item</th><th>Type</th><th>Rate</th><th>Qty</th><th>Detail</th><th>Amount (₹)</th><th></th></tr>
          </thead>
          <tbody>
            {rows.map(r => {
              const c = calc(r);
              const isCount = r.mode === 'count';
              return (
                <tr key={r.id}>
                  <td><input type="text" placeholder="Item" value={r.name} onChange={e => upd(r.id, 'name', e.target.value)} /></td>
                  <td>
                    <button
                      className={'mode-btn' + (isCount ? ' count' : '')}
                      onClick={() => toggleMode(r)}
                      title="Toggle between weight and count"
                    >{isCount ? '🥚 pc' : '⚖️ kg'}</button>
                  </td>
                  <td>
                    <input
                      type="number" step="0.01" placeholder={isCount ? '₹/pc' : '₹/kg'}
                      value={r.price}
                      autoFocus={r.id === lastAdded}
                      onChange={e => updPrice(r, e.target.value)}
                      onKeyDown={e => e.key === 'Enter' && addRow(r.mode)}
                    />
                  </td>
                  <td>
                    {isCount ? (
                      <div className="stp">
                        <button onClick={() => setQty(r, (parseInt(r.qty, 10) || 0) - 1)}>−</button>
                        <input
                          type="number" placeholder="0"
                          value={r.qty}
                          onChange={e => upd(r.id, 'qty', e.target.value)}
                          onKeyDown={e => e.key === 'Enter' && addRow(r.mode)}
                        />
                        <button onClick={() => setQty(r, (parseInt(r.qty, 10) || 0) + 1)}>+</button>
                      </div>
                    ) : (
                      <div className="stp">
                        <input
                          className="wide"
                          type="number" step="0.01" placeholder="0"
                          value={r.qty}
                          onChange={e => upd(r.id, 'qty', e.target.value)}
                          onKeyDown={e => e.key === 'Enter' && addRow(r.mode)}
                        />
                        <select value={r.unit || 'g'} onChange={e => upd(r.id, 'unit', e.target.value)}>
                          <option value="g">g</option>
                          <option value="kg">kg</option>
                        </select>
                      </div>
                    )}
                  </td>
                  <td className="detail-cell">{c.ok ? c.detail : '—'}</td>
                  <td className="amt-cell">{c.ok ? fmt2(c.amt) : '—'}</td>
                  <td><button className="del" onClick={() => delRow(r.id)}>✕</button></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {anyOk && (
        <React.Fragment>
          <div className="mini" style={{ textAlign: 'center', marginTop: 10, marginBottom: 4 }}>🧾 GST on total</div>
          <div className="presets" style={{ marginTop: 0 }}>
            {[0, 5, 12, 18, 28].map(r => (
              <button
                key={r}
                className={gstCustom === '' && effGst === r ? 'active-rate' : ''}
                onClick={() => { setGstRate(r); setGstCustom(''); }}
              >{r}% GST</button>
            ))}
            <input
              type="number" step="0.01" placeholder="Custom %"
              value={gstCustom}
              onChange={e => setGstCustom(e.target.value)}
              style={{ width: 100 }}
            />
          </div>

          <div className="total-big">
            <div>
              <div className="mini">Grand total ({wCount} weight + {cCount} count items)</div>
              {effGst > 0 && (
                <div className="mini">Subtotal ₹ {fmt2(subtotal)} + GST ({effGst}%) ₹ {fmt2(gstAmt)}</div>
              )}
              <div className="amt">₹ {fmt2(total)}</div>
            </div>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
              <CopyCashWithGSTBtn itemCount={wCount + cCount} subtotal={subtotal} gstRate={effGst} gstAmt={gstAmt} total={total} />
              <button className="send" onClick={() => sendToBreakdown('🛒', 'Provision shop', total)}>🔗 Breakdown</button>
            </div>
          </div>
          <CashBreakdown amount={total} compact />
        </React.Fragment>
      )}
    </div>
  );
}

/* ---- 11b. Rate Finder ---- */
function RateFinder({ sendToBreakdown }) {
  const [paid, setPaid] = useState('');
  const [w, setW] = useState('');
  const [unit, setUnit] = useState('g');

  const a = parseFloat(paid), wt = parseFloat(w);
  const grams = (!isNaN(wt) && wt > 0) ? (unit === 'kg' ? wt * 1000 : wt) : 0;
  const ok = !isNaN(a) && a > 0 && grams > 0;
  const perG = ok ? a / grams : 0;

  return (
    <div>
      <div className="grid3">
        <div className="field">
          <label>Amount paid (₹)</label>
          <input type="number" step="0.01" placeholder="e.g. 90" value={paid} onChange={e => setPaid(e.target.value)} />
        </div>
        <div className="field">
          <label>Weight</label>
          <input type="number" step="0.01" placeholder="e.g. 250" value={w} onChange={e => setW(e.target.value)} />
        </div>
        <div className="field">
          <label>Unit</label>
          <select value={unit} onChange={e => setUnit(e.target.value)}>
            <option value="g">Grams (g)</option>
            <option value="kg">Kilograms (kg)</option>
          </select>
        </div>
      </div>
      <div className="row-actions" style={{ justifyContent: 'center', marginTop: 0, marginBottom: 6 }}>
        <button className="ghost" onClick={() => { setPaid(''); setW(''); setUnit('g'); }}>🧹 Clear all</button>
      </div>

      {ok && (
        <div className="result-box" key={paid + '|' + w + '|' + unit}>
          <h3>🔍 ACTUAL RATE YOU PAID</h3>
          <div className="stat"><span className="k">Per gram</span><span className="v">₹ {formatIndian(perG, 4)}</span></div>
          <div className="stat"><span className="k">Per 100 g</span><span className="v">₹ {fmt2(perG * 100)}</span></div>
          <div className="stat"><span className="k">Per kg</span><span className="v">₹ {fmt2(perG * 1000)}</span></div>
          <div className="row-actions" style={{ justifyContent: 'center' }}>
            <CopyTextBtn
              label="📋 Copy rate"
              lines={[
                'Amount paid: ₹ ' + fmt2(a),
                'Weight: ' + w + ' ' + unit,
                'Per gram: ₹ ' + formatIndian(perG, 4),
                'Per 100 g: ₹ ' + fmt2(perG * 100),
                'Per kg: ₹ ' + fmt2(perG * 1000),
              ]}
            />
            <button className="send" onClick={() => sendToBreakdown('🔍', 'Rate ₹' + fmt2(perG * 1000) + '/kg', perG * 1000)}>
              🔗 Rate as breakdown
            </button>
          </div>
        </div>
      )}
      {!ok && (paid !== '' || w !== '') && <p className="error">⚠️ Enter amount &amp; positive weight</p>}
    </div>
  );
}

        {[350, 500, 750, 900, 1200].map(x => (

      {ok && (
        <div className="result-box" key={pk}>
          <div className="stat"><span className="k">Per gram</span><span className="v">₹ {formatIndian(p / 1000, 4)}</span></div>

                  <tr key={g}>

/* ---- 11d. Kg ⇄ g mass converter ---- */
function Converter() {
  const [val, setVal] = useState('');
  const [unit, setUnit] = useState('kg');
  const n = parseFloat(val);
  const ok = val !== '' && !isNaN(n);
  const kg = ok ? n * MASS_UNITS.find(m => m.k === unit).f : 0;
  const dec = x => (Math.abs(x) >= 1000 ? 2 : Math.abs(x) >= 1 ? 3 : Math.abs(x) >= 0.001 ? 4 : 6);

  return (
    <div>
      <div className="grid2">
        <div className="field">
          <label>Value</label>
          <input type="number" placeholder="e.g. 1.25" value={val} onChange={e => setVal(e.target.value)} />
        </div>
        <div className="field">
          <label>From unit</label>
          <select value={unit} onChange={e => setUnit(e.target.value)}>
            {MASS_UNITS.map(m => <option key={m.k} value={m.k}>{m.label}</option>)}
          </select>
        </div>
      </div>
      <div className="row-actions" style={{ justifyContent: 'center', marginTop: 0, marginBottom: 6 }}>
        <button className="ghost" onClick={() => { setVal(''); setUnit('kg'); }}>🧹 Clear all</button>
      </div>
      {ok && (
        <div className="result-box" key={val + unit}>
          {MASS_UNITS.map(m => (
            <div className="stat" key={m.k}>
              <span className="k">{m.label}</span>
              <span className="v">{formatIndian(kg / m.f, dec(kg / m.f))}</span>
            </div>
          ))}
          <div className="row-actions" style={{ justifyContent: 'center' }}>
            <CopyTextBtn
              label="📋 Copy conversion"
              lines={[
                'From: ' + val + ' ' + MASS_UNITS.find(m => m.k === unit).label,
                ...MASS_UNITS.map(m => m.label + ': ' + formatIndian(kg / m.f, dec(kg / m.f))),
              ]}
            />
          </div>
        </div>
      )}
    </div>
  );
}

/* ---- 11e. Item Counter ---- */
function Counter({ sendToBreakdown }) {
  const [raw, setItems] = useLocalStorage('counterItemsV1', null);
  const items = Array.isArray(raw) ? raw : [];
  const [v, setV] = useState('');

  const add = () => {
    const n = parseFloat(v);
    if (isNaN(n)) return;
    setItems([...items, { id: Date.now() + Math.random(), v: n }]);
    setV('');
  };
  const total = items.reduce((s, i) => s + i.v, 0);
  const avg = items.length ? total / items.length : 0;

  return (
    <div>
      <div className="input-row">
        <input
          type="number" step="0.01"
          placeholder="Enter item value (₹) → Enter adds"
          value={v}
          onChange={e => setV(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && add()}
        />
        <button onClick={add}>+ Add</button>
      </div>

      {items.length > 0 && (
        <React.Fragment>
          <div className="tbl-wrap">
            <table>
              <thead><tr><th>#</th><th>Value (₹)</th><th></th></tr></thead>
              <tbody>
                {items.map((it, idx) => (
                  <tr key={it.id}>
                    <td className="mini">{idx + 1}</td>
                    <td className="amt-cell">{fmt2(it.v)}</td>
                    <td><button className="del" onClick={() => setItems(items.filter(x => x.id !== it.id))}>✕</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <div className="result-box">
            <div className="stat"><span className="k">Total items</span><span className="v">{items.length}</span></div>
            <div className="stat"><span className="k">Total value</span><span className="v">₹ {fmt2(total)}</span></div>
            <div className="stat"><span className="k">Average</span><span className="v">₹ {fmt2(avg)}</span></div>
            <p className="words" style={{ margin: '10px 0 0' }}>"{fullWords(total)}"</p>
            <div className="row-actions" style={{ justifyContent: 'center' }}>
              <CopyCashWithItemsBtn
                itemLines={[
                  ...items.map((it, idx) => (idx + 1) + '. ₹ ' + fmt2(it.v)),
                  'Total items: ' + items.length,
                  'Average: ₹ ' + fmt2(avg),
                ]}
                total={total}
              />
              <button className="send" onClick={() => sendToBreakdown('📝', 'Item counter', total)}>🔗 Full breakdown</button>
              <button className="ghost" onClick={() => setItems([])}>🧹 Clear all</button>
            </div>
          </div>
          <CashBreakdown amount={total} compact />
        </React.Fragment>
      )}
    </div>
  );
}

/* ---- 11f. Shop Bill (daily milk route) ---- */
function ShopBill({ sendToBreakdown }) {
  const [raw, setItems] = useLocalStorage('shopBillV1', null);
  const items = Array.isArray(raw) && raw.length
    ? raw.map(i => ({ name: '', price: '', qty: 0, ...i }))
    : MILK_DEFAULTS.map(d => ({ ...d, qty: 0 }));
  const [round, setRound] = useState(false);
  const [quick, setQuick] = useState('');
  const [lastAdded, setLastAdded] = useState(null);

  const upd = (id, k, v) => setItems(items.map(i => (i.id === id ? { ...i, [k]: v } : i)));
  const setQty = (id, q) => upd(id, 'qty', Math.max(0, q));
  const rowTotal = (i) => {
    const p = parseFloat(i.price), q = parseInt(i.qty, 10) || 0;
    return (!isNaN(p) && q > 0) ? p * q : 0;
  };
  const total = items.reduce((s, i) => s + rowTotal(i), 0);
  const pay = round ? Math.round(total) : total;
  const diff = pay - total;
  const hasAny = items.some(i => rowTotal(i) > 0);
  const today = new Date().toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

  const quickAdd = () => {
    const name = quick.trim();
    const id = 'x' + Date.now();
    setItems([...items, { id, name, price: '', qty: 0 }]);
    setQuick('');
    setLastAdded(id);
  };
  const delRow = (id) => setItems(items.filter(i => i.id !== id));
  const clearQty = () => setItems(items.map(i => ({ ...i, qty: 0 })));
  const resetAll = () => setItems(MILK_DEFAULTS.map(d => ({ ...d, qty: 0 })));

  return (
    <div>
      <p className="date-row">🧾 Shop bill — {today}</p>
      <p className="mini" style={{ textAlign: 'center', marginBottom: 8 }}>Rates are saved automatically on this device 💾</p>

      <div className="input-row" style={{ marginBottom: 8 }}>
        <input
          type="text"
          placeholder='New item name → press Enter or + Add item'
          value={quick}
          onChange={e => setQuick(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && quickAdd()}
        />
        <button onClick={quickAdd}>+ Add item</button>
      </div>

      <div className="tbl-wrap">
        <table>
          <thead>
            <tr><th>Item</th><th>Price (₹)</th><th>Qty</th><th>Total (₹)</th><th></th></tr>
          </thead>
          <tbody>
            {items.map(i => (
              <tr key={i.id}>
                <td><input type="text" placeholder="Item" value={i.name} onChange={e => upd(i.id, 'name', e.target.value)} /></td>
                <td>
                  <input
                    type="number" step="0.01" placeholder="0"
                    value={i.price}
                    autoFocus={i.id === lastAdded}
                    onChange={e => upd(i.id, 'price', e.target.value)}
                  />
                </td>
                <td>
                  <div className="stp">
                    <button onClick={() => setQty(i.id, (parseInt(i.qty, 10) || 0) - 1)}>−</button>
                    <input type="number" value={i.qty} onChange={e => upd(i.id, 'qty', e.target.value)} />
                    <button onClick={() => setQty(i.id, (parseInt(i.qty, 10) || 0) + 1)}>+</button>
                  </div>
                </td>
                <td className="amt-cell">{fmt2(rowTotal(i))}</td>
                <td><button className="del" onClick={() => delRow(i.id)}>✕</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="row-actions">
        <button className="ghost" onClick={clearQty}>🧹 Clear quantities</button>
        <button className="ghost" onClick={resetAll}>↺ Reset defaults</button>
      </div>

      {hasAny && (
        <React.Fragment>
          <div className="total-big">
            <div>
              <div className="mini">Grand total</div>
              <div className="amt">₹ {fmt2(total)}</div>
              {round && diff !== 0 && <div className="mini">Round off: {diff > 0 ? '+' : ''}{fmt2(diff)}</div>}
            </div>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
              <label style={{ display: 'flex', alignItems: 'center', gap: 6, cursor: 'pointer', fontSize: '.82rem', color: '#cde6f5' }}>
                <input type="checkbox" checked={round} onChange={e => setRound(e.target.checked)} /> Round off
              </label>
              {round && <div className="amt" style={{ fontSize: '1.2rem' }}>Pay ₹ {fmt2(pay)}</div>}
              <CopyCashWithItemsBtn
                itemLines={items.filter(i => rowTotal(i) > 0).map(i => (
                  (i.name || 'Item') + ': ₹ ' + fmt2(i.price) + ' × ' + (parseInt(i.qty, 10) || 0) + ' = ₹ ' + fmt2(rowTotal(i))
                ))}
                total={pay}
              />
              <button className="send" onClick={() => sendToBreakdown('🥛', 'Shop bill', pay)}>🔗 Breakdown</button>
            </div>
          </div>
          <p className="words" style={{ marginTop: 12 }}>"{fullWords(pay)}"</p>
          <CashBreakdown amount={pay} compact />
        </React.Fragment>
      )}
    </div>
  );
}

/* ============================================================
   12. TAB: FUN — Tic-Tac-Toe & Stone Paper Scissors (pure time-pass)
   ============================================================ */
function TicTacToe() {
  const empty = Array(9).fill(null);
  const [board, setBoard] = useState(empty);
  const [turn, setTurn] = useState('X');
  const [scores, setScores] = useLocalStorage('tttScoresV1', { X: 0, O: 0, draw: 0 });

  const LINES = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],
    [0, 3, 6], [1, 4, 7], [2, 5, 8],
    [0, 4, 8], [2, 4, 6],
  ];

  const findWin = (b) => {
    for (const [a, x, c] of LINES) {
      if (b[a] && b[a] === b[x] && b[a] === b[c]) return { winner: b[a], line: [a, x, c] };
    }
    return null;
  };
  const win = findWin(board);
  const isDraw = !win && board.every(c => c);

  const play = (i) => {
    if (board[i] || win) return;
    const next = board.slice();
    next[i] = turn;
    setBoard(next);
    const w = findWin(next);
    if (w) setScores(s => ({ ...s, [w.winner]: s[w.winner] + 1 }));
    else if (next.every(c => c)) setScores(s => ({ ...s, draw: s.draw + 1 }));
    else setTurn(turn === 'X' ? 'O' : 'X');
  };

  const reset = () => { setBoard(empty); setTurn('X'); };

  return (
    <div>
      <p className="mini" style={{ textAlign: 'center', marginBottom: 10, fontSize: '.95rem' }}>
        {win ? win.winner + ' wins! 🎉' : isDraw ? "It's a draw 🤝" : turn + "'s turn"}
      </p>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8, maxWidth: 260, margin: '0 auto' }}>
        {board.map((c, i) => (
          <button
            key={i}
            onClick={() => play(i)}
            style={{
              aspectRatio: '1', fontSize: '1.9rem', fontWeight: 700, padding: 0,
              background: win && win.line.includes(i) ? 'rgba(79,195,161,0.35)' : 'rgba(255,255,255,0.08)',
              color: c === 'X' ? '#ffd36e' : '#a8f0dc',
            }}
          >{c}</button>
        ))}
      </div>
      <div className="row-actions" style={{ justifyContent: 'center', marginTop: 16 }}>
        <button className="ghost" onClick={reset}>🔄 New round</button>
        <button className="ghost" onClick={() => setScores({ X: 0, O: 0, draw: 0 })}>🧹 Clear scores</button>
      </div>
      <div className="result-box" style={{ marginTop: 14 }}>
        <div className="stat"><span className="k">❌ X wins</span><span className="v">{scores.X}</span></div>
        <div className="stat"><span className="k">⭕ O wins</span><span className="v">{scores.O}</span></div>
        <div className="stat"><span className="k">🤝 Draws</span><span className="v">{scores.draw}</span></div>
      </div>
    </div>
  );
}

function StonePaperScissors() {
  const CHOICES = [
    { k: 'stone', label: '🪨 Stone' },
    { k: 'paper', label: '📄 Paper' },
    { k: 'scissors', label: '✂️ Scissors' },
  ];
  const beats = { stone: 'scissors', paper: 'stone', scissors: 'paper' };
  const label = (k) => (CHOICES.find(c => c.k === k) || {}).label || '';
  const [you, setYou] = useState(null);
  const [cpu, setCpu] = useState(null);
  const [result, setResult] = useState('');
  const [scores, setScores] = useLocalStorage('spsScoresV1', { you: 0, cpu: 0, draw: 0 });

  const play = (choice) => {
    const cpuChoice = CHOICES[Math.floor(Math.random() * 3)].k;
    setYou(choice);
    setCpu(cpuChoice);
    if (choice === cpuChoice) { setResult("It's a tie 🤝"); setScores(s => ({ ...s, draw: s.draw + 1 })); }
    else if (beats[choice] === cpuChoice) { setResult('You win! 🎉'); setScores(s => ({ ...s, you: s.you + 1 })); }
    else { setResult('Computer wins 🤖'); setScores(s => ({ ...s, cpu: s.cpu + 1 })); }
  };

  return (
    <div>
      <div className="presets" style={{ marginTop: 0 }}>
        {CHOICES.map(c => <button key={c.k} onClick={() => play(c.k)}>{c.label}</button>)}
      </div>
      {you && (
        <div className="result-box" style={{ textAlign: 'center' }}>
          <div className="stat"><span className="k">You</span><span className="v">{label(you)}</span></div>
          <div className="stat"><span className="k">Computer</span><span className="v">{label(cpu)}</span></div>
          <p className="words" style={{ margin: '10px 0 0' }}>{result}</p>
        </div>
      )}
      <div className="row-actions" style={{ justifyContent: 'center', marginTop: 14 }}>
        <button className="ghost" onClick={() => setScores({ you: 0, cpu: 0, draw: 0 })}>🧹 Clear scores</button>
      </div>
      <div className="result-box" style={{ marginTop: 14 }}>
        <div className="stat"><span className="k">🙂 You</span><span className="v">{scores.you}</span></div>
        <div className="stat"><span className="k">🤖 Computer</span><span className="v">{scores.cpu}</span></div>
        <div className="stat"><span className="k">🤝 Draws</span><span className="v">{scores.draw}</span></div>
      </div>
    </div>
  );
}

function FunTab() {
  const [sub, setSub] = useState('ttt');
  return (
    <div>
      <div className="subtabs">
        <button className={sub === 'ttt' ? 'active' : ''} onClick={() => setSub('ttt')}>❌⭕ Tic-Tac-Toe</button>
        <button className={sub === 'sps' ? 'active' : ''} onClick={() => setSub('sps')}>🪨📄✂️ Stone Paper Scissors</button>
      </div>
      {sub === 'ttt' && <TicTacToe />}
      {sub === 'sps' && <StonePaperScissors />}
    </div>
  );
}

/* ============================================================
   13. APP SHELL
   ============================================================ */
const TABS = [
  { id: 'breakdown', label: '💰 Breakdown' },
  { id: 'calc', label: '🧮 Calculator' },
  { id: 'area', label: '📐 Area & Cost' },
  { id: 'emi', label: '🏦 EMI' },
  { id: 'gst', label: '🧾 GST' },
  { id: 'split', label: '👥 Split Bill' },
  { id: 'rate', label: '🛒 Rate Calc' },
  { id: 'fun', label: '🎮 Fun' },
];

function App() {
  const [tab, setTab] = useState('breakdown');
  const [coins, setCoins] = useState([]);
  const [history, setHistory] = useState([]);
  const [seed, setSeed] = useState(null);
  const coinTimer = useRef(null);

  const rain = () => {
    const nc = Array.from({ length: 15 }, (_, i) => ({
      id: Date.now() + i,
      left: Math.random() * 100,
      dur: 2 + Math.random() * 2,
    }));
    setCoins(nc);
    if (coinTimer.current) clearTimeout(coinTimer.current);
    coinTimer.current = setTimeout(() => setCoins([]), 4600);
  };

  const pushHistory = (icon, label, value) => {
    setHistory(h => [{ id: Date.now() + Math.random(), icon, label, value }, ...h].slice(0, 6));
  };

  const viewBreakdown = (value) => { setSeed({ v: value, ts: Date.now() }); setTab('breakdown'); };
  const sendToBreakdown = (icon, label, value) => { pushHistory(icon, label, value); rain(); viewBreakdown(value); };

  return (
    <div className="app">
      {coins.map(c => (
        <span key={c.id} className="coin" style={{ left: c.left + '%', animationDuration: c.dur + 's' }}>🪙</span>
      ))}
      <div className="card">
        <h1>💰 Indian Rupee Toolkit</h1>
        <p className="subtitle">Breakdown • Calculator • Area • EMI • GST • Split • Provision Shop — everything money, one place</p>

        <div className="tabs">
          {TABS.map(t => (
            <button
              key={t.id}
              className={'tab-btn' + (tab === t.id ? ' active' : '')}
              onClick={() => setTab(t.id)}
            >{t.label}</button>
          ))}
        </div>

        {tab === 'breakdown' && <BreakdownTab seed={seed} rain={rain} pushHistory={pushHistory} />}
        {tab === 'calc' && <CalculatorTab rain={rain} pushHistory={pushHistory} />}
        {tab === 'area' && <AreaTab sendToBreakdown={sendToBreakdown} />}
        {tab === 'emi' && <EMITab sendToBreakdown={sendToBreakdown} />}
        {tab === 'gst' && <GSTTab sendToBreakdown={sendToBreakdown} />}
        {tab === 'split' && <SplitTab sendToBreakdown={sendToBreakdown} />}
        {tab === 'rate' && <RateTab sendToBreakdown={sendToBreakdown} />}
        {tab === 'fun' && <FunTab />}

        {history.length > 0 && (
          <React.Fragment>
            <div className="h-title">🕘 Recent results — click to see full breakdown</div>
            <div className="history">
              {history.map(h => (
                <button key={h.id} className="h-item" onClick={() => viewBreakdown(h.value)}>
                  <span className="h-label">{h.icon} {h.label}</span>
                  <span className="h-val">{formatShort(h.value)}</span>
                </button>
              ))}
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
