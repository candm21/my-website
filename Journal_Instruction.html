<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Journal Instructions Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .modal {
      display: none;
      position: fixed;
      z-index: 50;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.6);
    }
    .modal-content {
      background-color: #fefefe;
      margin: 5% auto;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold text-center mb-6 text-gray-800">Journal Instructions Manager</h1>

    <div class="flex justify-between mb-4">
      <label class="flex items-center space-x-2">
        <input type="checkbox" id="isTL" onchange="renderJournals()" />
        <span class="text-sm text-gray-700">Enable Edit Mode</span>
      </label>
      <label class="flex items-center space-x-2">
        <input type="checkbox" id="showAllJournals" onchange="renderJournals()" />
        <span class="text-sm text-gray-700">Show All Journals</span>
      </label>
    </div>

    <input id="searchInput" type="text" placeholder="Search for journals..." 
      class="w-full px-4 py-2 mb-4 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      oninput="renderJournals()">

    <div id="addJournalSection" class="flex gap-2 mb-4" style="display: none;">
      <input id="journalIdInput" type="text" placeholder="Journal ID"
        class="flex-1 px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
      <input id="journalAlphaInput" type="text" placeholder="Journal Alpha"
        class="flex-1 px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
      <button onclick="addJournal()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Add</button>
    </div>

    <div class="flex justify-end mb-4">
      <button onclick="exportHTML()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition">
        Export HTML
      </button>
    </div>

    <div id="journalList" class="space-y-4"></div>
  </div>

  <div id="popupModal" class="modal">
    <div class="modal-content">
      <span onclick="closeModal()" class="float-right text-2xl cursor-pointer">&times;</span>
      <h2 id="popupTitle" class="text-xl font-bold mb-4"></h2>
      <p id="popupComment" class="text-gray-700 whitespace-pre-wrap"></p>
    </div>
  </div>

<script>
  let journals = JSON.parse(localStorage.getItem("journals") || "[]");

  function renderJournals() {
    const container = document.getElementById("journalList");
    container.innerHTML = "";
    const filter = document.getElementById("searchInput").value.toLowerCase();
    const showAll = document.getElementById("showAllJournals").checked;
    const isTL = document.getElementById("isTL").checked;

    document.getElementById("addJournalSection").style.display = isTL ? "flex" : "none";

    const filtered = journals
      .filter(j => (showAll || j.id.toLowerCase().includes(filter) || j.alpha.toLowerCase().includes(filter)))
      .sort((a, b) => a.id.localeCompare(b.id));

    if (!showAll && !filter) return;

    filtered.forEach(journal => {
      const card = document.createElement("div");
      card.className = "bg-white rounded-xl shadow p-4";

      card.innerHTML = `
        <div class="flex justify-between items-center mb-2">
          <div>
            <h2 class="text-lg font-bold text-gray-800">ID: ${journal.id}</h2>
            <p class="text-sm text-gray-600">Alpha: ${journal.alpha}</p>
          </div>
          <div class="flex gap-2">
            <button onclick="openModal('${journal.id}')" class="bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700 transition">
              View
            </button>
            ${isTL ? `
              <button onclick="deleteJournal('${journal.id}')" class="bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700 transition">
                Delete
              </button>` : ''}
          </div>
        </div>
        <textarea class="w-full p-2 text-sm border border-gray-300 rounded mb-2 resize-none" 
          ${isTL ? '' : 'readonly'} placeholder="Add instruction..." oninput="updateComment('${journal.id}', this.value)">${journal.comment || ""}</textarea>
        ${isTL ? `
          <button onclick="saveComment('${journal.id}')" class="bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700">Save</button>
          <button onclick="clearComment('${journal.id}')" class="bg-yellow-500 text-white px-3 py-1 rounded hover:bg-yellow-600 ml-2">Clear Comment</button>
        ` : ''}
      `;
      container.appendChild(card);
    });
  }

  function addJournal() {
    const id = document.getElementById("journalIdInput").value.trim().toUpperCase();
    const alpha = document.getElementById("journalAlphaInput").value.trim().toUpperCase();

    if (!id || !alpha) {
      alert("Please enter both Journal ID and Alpha.");
      return;
    }

    if (journals.find(j => j.id === id)) {
      alert("Journal ID already exists!");
      return;
    }

    journals.push({ id, alpha, comment: "" });
    localStorage.setItem("journals", JSON.stringify(journals));
    renderJournals();
    document.getElementById("journalIdInput").value = "";
    document.getElementById("journalAlphaInput").value = "";
  }

  function updateComment(id, value) {
    const journal = journals.find(j => j.id === id);
    if (journal) {
      journal.comment = value;
    }
  }

  function saveComment(id) {
    localStorage.setItem("journals", JSON.stringify(journals));
    alert("Instruction saved!");
    renderJournals();
  }

  function clearComment(id) {
    const journal = journals.find(j => j.id === id);
    if (journal) {
      journal.comment = "";
      localStorage.setItem("journals", JSON.stringify(journals));
      renderJournals();
    }
  }

  function deleteJournal(id) {
    if (confirm("Are you sure you want to delete this journal?")) {
      journals = journals.filter(j => j.id !== id);
      localStorage.setItem("journals", JSON.stringify(journals));
      renderJournals();
    }
  }

  function openModal(id) {
    const journal = journals.find(j => j.id === id);
    if (journal) {
      document.getElementById("popupTitle").textContent = `Instruction for ${journal.id}`;
      document.getElementById("popupComment").textContent = journal.comment || "No Instruction Available.";
      document.getElementById("popupModal").style.display = "block";
    }
  }

  function closeModal() {
    document.getElementById("popupModal").style.display = "none";
  }

  function exportHTML() {
    const htmlContent = `
      <html><head><title>Journal Instructions</title></head><body>
      <h1>Journal Instructions</h1>
      ${journals.map(j => `
        <div>
          <h2>Journal ID: ${j.id}</h2>
          <p><strong>Alpha:</strong> ${j.alpha}</p>
          <p><strong>Instruction:</strong><br>${j.comment || 'No Instruction Available.'}</p>
          <hr/>
        </div>
      `).join('')}
      </body></html>
    `;
    const blob = new Blob([htmlContent], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'journal_instructions.html';
    a.click();
    URL.revokeObjectURL(url);
  }

  renderJournals();
</script>

</body>
</html>
